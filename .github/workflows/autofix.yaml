---
name: autofix.ci
on: pull_request
permissions: {}
jobs:
  fix:
    uses: suzuki-shunsuke/js-autofix-action/.github/workflows/autofix-ci.yaml@99d1bfb4766dd79f826a7d7651b46c34b3c6d7c3 # v0.0.5
    permissions:
      contents: read
      id-token: write
    with:
      aqua_version: v2.65.2
    secrets:
      TAKUMI_GUARD_BOT_ID: ${{secrets.TAKUMI_GUARD_BOT_ID}}
  autofix:
    # Required status check of this workflow
    runs-on: ubuntu-26.04
    if: always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    timeout-minutes: 10
    permissions: {}
    needs:
      - fix
    steps:
      - run: exit 1
