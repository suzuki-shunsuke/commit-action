---
name: Test
on:
  workflow_call:
    inputs:
      sha:
        description: The commit SHA where the action was built
        required: true
        type: string
permissions: {}
jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-26.04
    permissions:
      contents: write # Push commits to test-pr-<pr number> branches
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{inputs.sha}}
          persist-credentials: false
      # The action built by the release job
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist

      - if: github.event_name == 'pull_request' && ! github.event.pull_request.head.repo.fork
        run: date > date.txt
      - if: github.event_name == 'pull_request' && ! github.event.pull_request.head.repo.fork
        uses: ./
        with:
          branch: test-pr-${{github.event.pull_request.number}}
          files: date.txt
      - if: github.event_name == 'pull_request' && ! github.event.pull_request.head.repo.fork
        run: date > date.txt
      - if: github.event_name == 'pull_request' && ! github.event.pull_request.head.repo.fork
        uses: ./
        with:
          github_token: ${{github.token}}
          branch: test-pr-${{github.event.pull_request.number}}
          files: date.txt
